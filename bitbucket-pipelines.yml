image: node:22

# Ambientes no Remote Config: NÃO PROD (nonprod) e PROD (prod). Um projeto Firebase para cada.
#
# Regras de deploy:
#  - develop                          -> só valida (NÃO publica: main é a única fonte do Firebase NÃO PROD)
#  - PR feature/* -> main (mergeado)  -> NÃO PROD, FF NOVA (após aprovação manual no pipeline)
#  - PR update/*  -> main (mergeado)  -> NÃO PROD, alteração de FF EXISTENTE (após aprovação manual)
#    (feature/* e update/* só alteram flags/ e env/nonprod/; nome de FF nunca se repete)
#  - PR release/* -> main (mergeado)  -> PROD (aprovação manual), time-gated pelo RM (release/* só altera env/prod/ e rm/)
# A origem do merge vem da mensagem do commit ("Merged in <branch> (pull request #N)").
# Merge sem origem identificável (fast-forward, push direto) não publica nada.
#
# Garantia "main = Firebase NÃO PROD":
#  - depois de cada deploy, o step "Verificar sincronia" compara main com o Remote Config real;
#  - se o deploy falhar, a pipeline custom `sync-nonprod` (agendada e/ou manual, sempre em main)
#    publica o que está em main quando houver divergência e confere de novo;
#  - `verify-nonprod` é a checagem só de leitura (--strict) para alarme.

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &validate
        name: Testes e validação das flags
        caches: [npm]
        script:
          - npm install --no-audit --no-fund
          - npm test
          - npm run validate
    - step: &validate-prod
        name: Validar regras de PROD (RM + dupla aprovação)
        caches: [npm]
        script:
          - npm install --no-audit --no-fund
          - npm run validate:prod
    - step: &merge-source
        name: Identificar origem do merge
        script:
          - sh scripts/ci/merge-source.sh > merge-source.txt
          - 'echo "Origem do merge: $(cat merge-source.txt)"'
        artifacts:
          - merge-source.txt

pipelines:
  pull-requests:
    '**':
      - step: *validate
      # feature/* e update/* não podem tocar em PROD; release/* só pode tocar em PROD.
      - step:
          name: Escopo da branch (feature/update = não PROD, release = PROD)
          script:
            - git fetch origin main:refs/remotes/origin/main
            - node scripts/check-scope.js "$BITBUCKET_BRANCH" origin/main
      # Nome de FF nunca se repete: feature/* só cria FF nova (consulta o Firebase NÃO PROD);
      # alterar FF existente exige branch update/*. Precisa de FIREBASE_SA_KEY_NONPROD como variável
      # de REPOSITÓRIO (secured), pois PR pipelines não recebem variáveis de Deployment.
      - step:
          name: FF nova x update (bloqueia nome duplicado)
          script:
            - git fetch origin main:refs/remotes/origin/main
            - npm install --no-audit --no-fund
            - node scripts/check-new-flags.js "$BITBUCKET_BRANCH" origin/main
      # Prévia: mostra no log o que seria publicado no Remote Config (não publica nada).
      # Só PR de release/* para main aplica as regras de PROD (RM + aprovações no arquivo).
      - step:
          name: Prévia do deploy (dry-run)
          script:
            - npm install --no-audit --no-fund
            - node scripts/deploy.js nonprod --dry-run
            - |
              if [ "$BITBUCKET_PR_DESTINATION_BRANCH" = "main" ]; then
                case "$BITBUCKET_BRANCH" in
                  release/*) npm run validate:prod && node scripts/deploy.js prod --dry-run ;;
                  *) echo "Origem $BITBUCKET_BRANCH: regras de PROD só se aplicam a release/*" ;;
                esac
              fi

  branches:
    # develop NÃO publica no Firebase: o que está em main é a única fonte do NÃO PROD.
    develop:
      - step: *validate

    main:
      - step: *merge-source
      - step: *validate
      # feature/* e update/* -> main: NÃO PROD. Só aparece se o merge alterou flags/ ou env/nonprod/.
      # APROVAÇÃO: fica pausado até alguém clicar em "Run" no pipeline.
      - step:
          name: Aprovar e publicar NÃO PROD (merge de feature/* ou update/*)
          trigger: manual
          deployment: test
          condition:
            changesets:
              includePaths:
                - "flags/**"
                - "env/nonprod/**"
          script:
            - npm install --no-audit --no-fund
            - sh scripts/ci/run-if-source.sh "feature/|update/" node scripts/deploy.js nonprod
      # Confere se main e o Remote Config NÃO PROD ficaram idênticos. Se falhar, use a pipeline sync-nonprod.
      - step:
          name: Verificar sincronia NÃO PROD (main = Firebase)
          deployment: test
          condition:
            changesets:
              includePaths:
                - "flags/**"
                - "env/nonprod/**"
          script:
            - npm install --no-audit --no-fund
            - node scripts/verify-sync.js nonprod
      # release/* -> main: PROD, time-gated pelo RM (antes de prodSchedule nada muda).
      # Só aparece se o merge alterou env/prod/ ou rm/.
      - step:
          name: Validar regras de PROD (merge de release/*)
          condition:
            changesets:
              includePaths:
                - "env/prod/**"
                - "rm/**"
          script:
            - npm install --no-audit --no-fund
            - sh scripts/ci/run-if-source.sh release/ npm run validate:prod
      - step:
          name: Gate de aprovação (plataforma + equipe)
          condition:
            changesets:
              includePaths:
                - "env/prod/**"
                - "rm/**"
          script:
            - sh scripts/ci/run-if-source.sh release/ node scripts/check-approvals.js
      # APROVAÇÃO: fica pausado até alguém clicar em "Run" (restrinja quem pode em Deployments).
      - step:
          name: Aprovar e publicar PROD (merge de release/*)
          trigger: manual
          deployment: production
          condition:
            changesets:
              includePaths:
                - "env/prod/**"
                - "rm/**"
          script:
            - npm install --no-audit --no-fund
            - sh scripts/ci/run-if-source.sh release/ node scripts/deploy.js prod

  custom:
    # Retentativa/sincronia do NÃO PROD: se houver divergência entre main e o Firebase (ex.: um deploy falhou),
    # publica o que está em main e confere de novo. Sem divergência, não muda nada.
    # Agende (ex.: a cada 30 min) e/ou rode manualmente, SEMPRE em main. Só publica conteúdo que já passou pelo PR.
    sync-nonprod:
      - step:
          name: Sincronizar NÃO PROD com main
          deployment: test
          script:
            - |
              if [ "$BITBUCKET_BRANCH" != "main" ]; then echo "Rode esta pipeline na branch main (atual: $BITBUCKET_BRANCH)"; exit 1; fi
            - npm install --no-audit --no-fund
            - node scripts/verify-sync.js nonprod --fix

    # Só leitura: falha se main e o Firebase NÃO PROD divergirem (inclui chaves que só existem no Firebase).
    verify-nonprod:
      - step:
          name: Verificar sincronia NÃO PROD (só leitura)
          deployment: test
          script:
            - |
              if [ "$BITBUCKET_BRANCH" != "main" ]; then echo "Rode esta pipeline na branch main (atual: $BITBUCKET_BRANCH)"; exit 1; fi
            - npm install --no-audit --no-fund
            - node scripts/verify-sync.js nonprod --strict

    # Crie um schedule (ex.: a cada 15 min) no Bitbucket apontando para esta pipeline em main.
    # É idempotente: avança os estágios do rollout conforme o horário.
    prod-scheduler:
      - step: *validate-prod
      - step:
          name: Deploy PROD (avanço de rollout)
          deployment: production
          script:
            - npm install --no-audit --no-fund
            - node scripts/deploy.js prod

    # Simulação manual sem publicar nada
    plan-prod:
      - step:
          name: Plano de PROD (dry-run)
          script:
            - npm install --no-audit --no-fund
            - node scripts/deploy.js prod --dry-run
