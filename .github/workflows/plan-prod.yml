name: plan-prod
# Simulação de PROD, sem publicar nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plano de PROD (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          node scripts/deploy.js prod --dry-run
