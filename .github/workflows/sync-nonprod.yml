name: sync-nonprod
# Se a main e o Firebase NÃO PROD divergirem (um deploy falhou ou não foi aprovado), publica o que está na main e
# confere de novo. Manual, só na main, com aprovação no ambiente nonprod. Sem divergência, não muda nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sincronizar NÃO PROD com a main
    if: github.ref == 'refs/heads/main'
    environment: nonprod
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA_KEY_NONPROD: ${{ secrets.FIREBASE_SA_KEY_NONPROD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          node scripts/verify-sync.js nonprod --fix
